  <path d="M 30 49 C 36 46, 43 44, 48 44" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.4"/>

  <!-- Pass-through XR Cameras & Tracking Sensors (Quest 3 / Vision Pro style) -->
  <!-- Left Dual Tracking Cameras -->
  <circle cx="31" cy="58" r="2.5" fill="#9B1C2E"/>
  <circle cx="37" cy="62" r="2" fill="#0891B2"/>
  
  <!-- Center LiDAR / Depth Sensor Matrix -->
  <rect x="45" y="40" width="6" height="2.5" rx="1.2" fill="#9B1C2E"/>

  <!-- Right Dual Tracking Cameras -->
  <circle cx="65" cy="58" r="2.5" fill="#9B1C2E"/>
  <circle cx="59" cy="62" r="2" fill="#0891B2"/>

  <!-- Top Dial / Digital Crown / Power Indicator -->
  <rect x="62" y="32" width="6" height="3" rx="1" fill="#9B1C2E"/>
