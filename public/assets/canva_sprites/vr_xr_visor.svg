  <path d="M 22 46 C 22 38, 30 35, 48 35 C 66 35, 74 38, 74 46 L 73 60 C 73 68, 62 71, 48 71 C 34 71, 23 68, 23 60 Z" fill="#111111" stroke="#0F172A" stroke-width="2.5"/>

