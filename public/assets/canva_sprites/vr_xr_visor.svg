<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none">
  <!-- Ergonomic Top & Side Head Straps -->
  <path d="M 22 46 C 14 46, 8 40, 8 32 C 8 22, 24 16, 48 16 C 72 16, 88 22, 88 32 C 88 40, 82 46, 74 46" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 2"/>
  
  <!-- Side Strap Hinges & Audio Nodes -->
  <rect x="18" y="44" width="6" height="12" rx="3" fill="#111111" stroke="#334155" stroke-width="1.5"/>
  <rect x="72" y="44" width="6" height="12" rx="3" fill="#111111" stroke="#334155" stroke-width="1.5"/>

  <!-- Face Cushion / Light Seal Interface -->
  <path d="M 24 44 C 24 38, 32 34, 48 34 C 64 34, 72 38, 72 44 L 70 60 C 70 66, 62 68, 48 68 C 34 68, 26 66, 26 60 Z" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="2"/>

