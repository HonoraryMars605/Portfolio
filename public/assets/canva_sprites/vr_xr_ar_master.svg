<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" width="300" height="100" fill="none">
  <!-- 1. VR IMMERSIVE VISOR -->
  <g id="vr-visor" transform="translate(0, 0)">
    <!-- Straps -->
    <path d="M 18 46 C 12 46, 6 40, 6 32 C 6 22, 20 16, 48 16 C 76 16, 90 22, 90 32 C 90 40, 84 46, 78 46" stroke="#475569" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 2"/>
    <rect x="14" y="44" width="6" height="10" rx="2.5" fill="#111111"/>
    <rect x="76" y="44" width="6" height="10" rx="2.5" fill="#111111"/>
    <!-- Cushion -->
    <path d="M 22 42 C 22 36, 30 33, 48 33 C 66 33, 74 36, 74 42 L 72 58 C 72 64, 64 66, 48 66 C 32 66, 24 64, 24 58 Z" fill="#E2E8F0"/>
    <!-- Curved Visor Body -->
    <path d="M 20 44 C 20 36, 28 33, 48 33 C 68 33, 76 36, 76 44 L 75 60 C 75 68, 64 71, 48 71 C 32 71, 21 68, 21 60 Z" fill="#111111" stroke="#0F172A" stroke-width="2"/>
    <!-- Specular Arc -->
    <path d="M 26 44 C 32 38, 42 36, 48 36 C 54 36, 64 38, 70 44" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <!-- Status LED -->
    <circle cx="48" cy="42" r="2.5" fill="#9B1C2E"/>
  </g>

  <!-- 2. XR SPATIAL PASS-THROUGH VISOR -->
  <g id="xr-spatial" transform="translate(100, 0)">
    <!-- Straps & Dial -->
    <path d="M 18 46 C 10 46, 6 38, 6 30 C 6 20, 20 15, 48 15 C 76 15, 90 20, 90 30 C 90 38, 86 46, 78 46" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="48" cy="15" r="4" fill="#9B1C2E"/>
    <!-- Front Glass Enclosure -->
    <path d="M 20 44 C 20 35, 28 32, 48 32 C 68 32, 76 35, 76 44 L 75 62 C 75 70, 64 73, 48 73 C 32 73, 21 70, 21 62 Z" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
    <!-- Glass Reflection -->
    <path d="M 25 43 C 32 37, 42 35, 48 35 C 54 35, 64 37, 71 43" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
    <path d="M 28 47 C 34 43, 42 41, 48 41" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
    <!-- Multi-Sensor Pass-Through Tracking Lenses -->
    <circle cx="29" cy="58" r="3" fill="#9B1C2E"/>
    <circle cx="36" cy="63" r="2.2" fill="#0891B2"/>
    <circle cx="67" cy="58" r="3" fill="#9B1C2E"/>
    <circle cx="60" cy="63" r="2.2" fill="#0891B2"/>
    <!-- LiDAR Array -->
    <rect x="44" y="38" width="8" height="3" rx="1.5" fill="#0891B2"/>
  </g>

  <!-- 3. AR SMART GLASSES -->
  <g id="ar-glasses" transform="translate(200, 0)">
    <!-- Frames -->
    <path d="M 12 42 L 20 46 M 88 42 L 80 46" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    <!-- Left Lens Frame -->
    <rect x="18" y="42" width="26" height="24" rx="7" fill="#F8FAFC" stroke="#111111" stroke-width="2.5"/>
    <!-- Left Waveguide Grid -->
    <line x1="22" y1="51" x2="40" y2="51" stroke="#0891B2" stroke-width="1.2" stroke-dasharray="2 2"/>
    <line x1="22" y1="57" x2="40" y2="57" stroke="#0891B2" stroke-width="1.2" stroke-dasharray="2 2"/>
    <circle cx="31" cy="54" r="3" fill="#9B1C2E"/>
    <!-- Bridge -->
    <path d="M 44 49 C 46 45, 54 45, 56 49" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
    <circle cx="50" cy="46" r="1.5" fill="#0891B2"/>
    <!-- Right Lens Frame -->
    <rect x="56" y="42" width="26" height="24" rx="7" fill="#F8FAFC" stroke="#111111" stroke-width="2.5"/>
    <!-- Right Waveguide Grid -->
    <line x1="60" y1="51" x2="78" y2="51" stroke="#0891B2" stroke-width="1.2" stroke-dasharray="2 2"/>
    <line x1="60" y1="57" x2="78" y2="57" stroke="#0891B2" stroke-width="1.2" stroke-dasharray="2 2"/>
    <circle cx="69" cy="54" r="3" fill="#9B1C2E"/>
  </g>
</svg>
