<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none">
  <!-- AR Smart Glasses Frames & Waveguide Display -->
  <!-- Left & Right Temples / Arms -->
  <path d="M 12 40 L 22 46 M 84 40 L 74 46" stroke="#475569" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="10" y="38" width="6" height="5" rx="1.5" fill="#9B1C2E"/>
  <rect x="80" y="38" width="6" height="5" rx="1.5" fill="#9B1C2E"/>

  <!-- Left Lens Frame -->
  <rect x="20" y="42" width="24" height="24" rx="7" fill="#F1F5F9" stroke="#111111" stroke-width="3"/>
  <!-- Left AR Waveguide Holographic Grid Projection -->
  <path d="M 24 50 L 40 50 M 24 56 L 40 56 M 32 46 L 32 62" stroke="#0891B2" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <circle cx="32" cy="54" r="3" fill="#9B1C2E"/>

  <!-- Nose Bridge & Optical Sensor -->
  <path d="M 44 48 C 46 44, 50 44, 52 48" stroke="#111111" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="48" cy="45" r="1.5" fill="#0891B2"/>

  <!-- Right Lens Frame -->
  <rect x="52" y="42" width="24" height="24" rx="7" fill="#F1F5F9" stroke="#111111" stroke-width="3"/>
  <!-- Right AR Waveguide Holographic Grid Projection -->
  <path d="M 56 50 L 72 50 M 56 56 L 72 56 M 64 46 L 64 62" stroke="#0891B2" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <circle cx="64" cy="54" r="3" fill="#9B1C2E"/>

  <!-- Spatial Horizon Indicator -->
  <line x1="28" y1="74" x2="68" y2="74" stroke="#9B1C2E" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 3"/>
</svg>
