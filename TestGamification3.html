<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio — Sistema Solare Interattivo</title>
    <style>
        /* Base */
        body, html {
            margin:0; padding:0;
            width:100%; height:100%;
            background: radial-gradient(circle at center, #0b0b0d 0%, #111 100%);
            font-family: 'Segoe UI', sans-serif;
            color:#fff;
            overflow:hidden;
        }
        h1{text-align:center; margin:20px 0; font-weight:400; color:#fff}

        /* Sistema Solare */
        .solar-system {
            position: relative;
            width:100%; height: calc(100% - 60px);
            display:flex; justify-content:center; align-items:center;
        }

        /* Sole */
        .sun {
            width:120px; height:120px;
            border-radius:50%;
            background: radial-gradient(circle at 30% 30%, #FFD93D, #FFA500);
            box-shadow: 0 0 60px rgba(255,200,0,0.8);
            position: relative;
            z-index:10;
            animation: sunGlow 4s ease-in-out infinite alternate;
        }
        @keyframes sunGlow {
            0% { box-shadow: 0 0 40px rgba(255,200,0,0.6); }
            100% { box-shadow: 0 0 80px rgba(255,220,0,0.9); }
        }

        /* Orbite */
        .orbit {
            position:absolute;
            border:1px dashed rgba(255,255,255,0.1);
            border-radius:50%;
            top:50%; left:50%;
            transform: translate(-50%,-50%);
        }

        /* Pianeti */
        .planet {
            position:absolute;
            border-radius:50%;
            cursor:pointer;
            display:flex; justify-content:center; align-items:center;
            font-size:12px; text-align:center;
            color:#fff;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .planet:hover{
            transform: scale(1.2);
            box-shadow: 0 0 20px rgba(255,255,255,0.7);
        }

        /* Orbital animation */
        @keyframes orbitAnim {
            0%{transform: rotate(0deg) translateX(var(--radius)) rotate(0deg);}
            100%{transform: rotate(360deg) translateX(var(--radius)) rotate(-360deg);}
        }

        /* Pianeti specifici */
        .planet-1{--radius:80px; width:25px; height:25px; background: linear-gradient(45deg,#AB2636,#FF6F61); animation: orbitAnim 8s linear infinite;}
        .planet-2{--radius:140px; width:35px; height:35px; background: linear-gradient(45deg,#1565C0,#4FC3F7); animation: orbitAnim 14s linear infinite;}
        .planet-3{--radius:200px; width:45px; height:45px; background: linear-gradient(45deg,#2E003E,#7E57C2); animation: orbitAnim 22s linear infinite;}
        .planet-4{--radius:270px; width:40px; height:40px; background: linear-gradient(45deg,#FF6F00,#FFB74D); animation: orbitAnim 30s linear infinite;}

        /* Pop-up */
        .popup {
            position:fixed;
            top:50%; left:50%;
            transform: translate(-50%, -50%) scale(0);
            width:80%; max-width:450px;
            background: linear-gradient(to bottom, rgba(20,20,30,0.98), rgba(10,10,15,0.98));
            border:2px solid #AB2636;
            border-radius:14px;
            padding:20px;
            box-shadow:0 10px 40px rgba(0,0,0,0.7);
            z-index:100;
            transition: transform 0.3s ease;
        }
        .popup.active { transform: translate(-50%, -50%) scale(1); }
        .popup h2 { margin-top:0; color:#AB2636; font-size:22px; }
        .popup p { color:#ccc; font-size:15px; margin:10px 0; line-height:1.4; }
        .popup a {
            display:inline-block;
            margin-top:10px;
            text-decoration:none;
            color:#fff;
            background:#AB2636;
            padding:8px 14px;
            border-radius:6px;
            font-size:14px;
            transition: background 0.2s;
        }
        .popup a:hover{ background:#FF6F61; }
        .popup button {
            margin-top:15px;
            padding:8px 16px;
            background:#555;
            border:none;
            border-radius:6px;
            color:#fff;
            cursor:pointer;
            font-size:14px;
        }

        /* Responsive */
        @media(max-width:520px){
            .planet-1{--radius:50px;}
            .planet-2{--radius:90px;}
            .planet-3{--radius:130px;}
            .planet-4{--radius:170px;}
            .popup{width:90%;}
        }
    </style>
</head>
<body>
<h1>Il mio Sistema Solare di Progetti</h1>

<div class="solar-system">
    <div class="sun"></div>

    <div class="orbit" style="width:160px;height:160px;"></div>
    <div class="planet planet-1" data-title="Progetto 1" data-desc="Gameplay prototype realizzato in Unity" data-link="#">P1</div>

    <div class="orbit" style="width:280px;height:280px;"></div>
    <div class="planet planet-2" data-title="Progetto 2" data-desc="WebGL demo e shader interattivi" data-link="#">P2</div>

    <div class="orbit" style="width:400px;height:400px;"></div>
    <div class="planet planet-3" data-title="Progetto 3" data-desc="Tooling e editor extensions" data-link="#">P3</div>

    <div class="orbit" style="width:540px;height:540px;"></div>
    <div class="planet planet-4" data-title="Progetto 4" data-desc="Concept UI e animazioni menu" data-link="#">P4</div>
</div>

<!-- Pop-up -->
<div class="popup" id="popup">
    <h2 id="popupTitle">Titolo Progetto</h2>
    <p id="popupDesc">Descrizione progetto</p>
    <a href="#" id="popupLink" target="_blank">Vai al progetto</a>
    <button id="closePopup">Chiudi</button>
</div>

<script>
    const planets = document.querySelectorAll('.planet');
    const popup = document.getElementById('popup');
    const popupTitle = document.getElementById('popupTitle');
    const popupDesc = document.getElementById('popupDesc');
    const popupLink = document.getElementById('popupLink');
    const closePopup = document.getElementById('closePopup');

    // Click su pianeta
    planets.forEach(p => {
        p.addEventListener('click', ()=>{
            popupTitle.textContent = p.dataset.title;
            popupDesc.textContent = p.dataset.desc;
            popupLink.href = p.dataset.link || '#';
            popup.classList.add('active');
        });
    });

    // Chiudi pop-up
    closePopup.addEventListener('click', ()=>{ popup.classList.remove('active'); });
    window.addEventListener('click', (e)=>{
        if(!popup.contains(e.target) && !e.target.classList.contains('planet')) popup.classList.remove('active');
    });
</script>
</body>
</html>
