<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Progetti</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>Portfolio Progetti</h1>
</header>

<main>
    <section class="projects-section">
        <h2>I miei progetti</h2>
        <div id="listaProgetti" class="projects-container"></div>
    </section>

    <section class="add-project">
        <h2>Aggiungi nuovo progetto</h2>
        <form id="formProgetto">
            <input type="text" id="titolo" placeholder="Titolo" required>
            <textarea id="descrizione" placeholder="Descrizione" required></textarea>
            <input type="text" id="link" placeholder="Link (opzionale)">
            <input type="text" id="tech" placeholder="Tecnologie (opzionale)">
            <button type="submit">Aggiungi Progetto</button>
        </form>
    </section>
</main>

<script src="script.js"></script>
</body>
</html>
